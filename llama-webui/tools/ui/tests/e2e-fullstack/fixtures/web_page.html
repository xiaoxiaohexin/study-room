		<main>
			<h1>光合作用</h1>
			<p>
				光合作用是绿色植物利用光能，把二氧化碳和水转化为有机物并释放氧气的过程。
				它分为光反应与暗反应两个阶段：光反应在类囊体膜上进行，产生 ATP 与 NADPH；
				暗反应在叶绿体基质中进行，通过卡尔文循环固定二氧化碳。
			</p>
			<h2>影响因素</h2>
			<p>影响光合作用速率的环境因素包括光照强度、二氧化碳浓度和温度等。</p>
			<h2>复习要点</h2>
			<ul>
				<li>光反应与暗反应的区别与联系</li>
				<li>卡尔文循环的三阶段</li>
				<li>光合作用与呼吸作用的对比</li>
			</ul>
		</main>
