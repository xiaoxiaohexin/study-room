[project]
name = "agent-backend"
version = "0.1.0"
description = "Agent assistant backend: FastAPI + SSE + Memory + RAG + GSSC ContextBuilder + ReAct loop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "aiosqlite>=0.20",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
docs = ["markitdown>=0.0.1"]
graph = ["neo4j>=5.20"]
cache = ["redis>=5.0"]
local-embed = ["sentence-transformers>=3.0"]
mcp = ["mcp>=1.0"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_temp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP042"]
